# Configuración del panel (Decap CMS) — https://decapcms.org/docs/
#
# Login: con cuenta de GitHub (botón "Iniciar sesión con GitHub").
# - Cada persona necesita una cuenta de GitHub con permiso de escritura en el repositorio
#   (github.com/davidnbritez/nicehome → Settings → Collaborators).
# - El inicio de sesión pasa por un servicio gratis en Cloudflare (sveltia-cms-auth), ver README.
#
# El panel guarda en la rama "borrador", NO en la web.
# - Vista previa del borrador: https://borrador.nicehomepy.pages.dev
# - Para pasar los cambios a la web: "Publicar cambios en la web" en el menú del panel
#   (GitHub Actions → "Publicar cambios" → Run workflow).
backend:
  name: github
  repo: davidnbritez/nicehome
  branch: borrador
  # Dirección del servicio de inicio de sesión (worker de Cloudflare). La completa Claude Code cuando exista.
  base_url: https://sveltia-cms-auth.TU-SUBDOMINIO.workers.dev
  commit_messages:
    create: "Nuevo {{collection}}: {{slug}}"
    update: "Editar {{collection}}: {{slug}}"
    delete: "Borrar {{collection}}: {{slug}}"
    uploadMedia: "Subir foto {{path}}"
    deleteMedia: "Borrar foto {{path}}"

locale: es
# Solo en esta computadora (localhost): permite probar el panel con "npx decap-server" sin login.
local_backend: true
# "Ver sitio" del panel abre la vista previa del borrador (gratis), no la web publicada.
site_url: https://borrador.nicehomepy.pages.dev
display_url: https://nicehomepy.pages.dev

# Las fotos se guardan en src/assets/uploads para que el sitio las convierta a WebP.
media_folder: src/assets/uploads
public_folder: /uploads

collections:
  - name: productos
    label: Productos
    label_singular: Producto
    description: "Cada producto del catálogo. Lo que guardás queda en el borrador; para que se vea en la web usá «Publicar cambios»."
    folder: src/content/productos
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{fields.slug}}"
    identifier_field: nombre
    summary: "{{activo | ternary('', '[OCULTO] ')}}{{nombre}} — Gs. {{precio}}{{precioOferta | ternary(' · OFERTA', '')}}{{agotado | ternary(' · AGOTADO', '')}}"
    sortable_fields: [orden, nombre, precio, categoria]
    view_filters:
      - { label: Desactivados, field: activo, pattern: false }
      - { label: Agotados, field: agotado, pattern: true }
      - { label: Destacados, field: destacado, pattern: true }
      - { label: Nuevos, field: nuevo, pattern: true }
    view_groups:
      - { label: Tipo, field: categoria }
    fields:
      - { name: activo, label: Activo (se muestra en la web), widget: boolean, default: true, hint: "Apagado: el producto no aparece en la web, pero no se borra." }
      - { name: agotado, label: Agotado, widget: boolean, default: false, hint: "Aparece en la web pero no se puede agregar al pedido; muestra el botón Avisarme." }
      - { name: nombre, label: Nombre, widget: string }
      - name: slug
        label: Identificador (va en el enlace)
        hint: Solo minúsculas, números y guiones. Ej. funda-almohadon-lino. No lo cambies después de publicar.
        widget: string
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Solo minúsculas, números y guiones']
      - name: categoria
        label: Tipo de producto
        widget: relation
        collection: tienda
        file: config
        value_field: "tipos.*"
        search_fields: ["tipos.*"]
        display_fields: ["tipos.*"]
      - name: ambientes
        label: Ambientes
        widget: relation
        multiple: true
        collection: tienda
        file: config
        value_field: "ambientes.*"
        search_fields: ["ambientes.*"]
        display_fields: ["ambientes.*"]
      - { name: precio, label: "Precio normal (Gs.)", widget: number, value_type: int, min: 0, hint: "Sin puntos. Ej. 85000" }
      - { name: precioOferta, label: "Precio de oferta (Gs.)", widget: number, value_type: int, min: 0, required: false, hint: "Promoción: si lo completás, la web cobra este precio y muestra el normal tachado con el % de descuento. Borralo para terminar la oferta." }
      - { name: etiqueta, label: Etiqueta, widget: string, required: false, hint: "Ej. Oferta, Más vendido, Hecho a mano" }
      - { name: destacado, label: Destacado, widget: boolean, default: false, hint: "Aparece primero en el orden Destacados." }
      - { name: nuevo, label: Nuevo, widget: boolean, default: false }
      - { name: fotos, label: Fotos, widget: list, required: false, field: { name: foto, label: Foto, widget: image }, hint: "La primera es la principal. Ideal: fondo claro, luz natural, formato horizontal 4:3." }
      - { name: resumen, label: Resumen (una línea), widget: string, required: false }
      - { name: descripcion, label: Descripción, widget: text, required: false }
      - { name: medida, label: Medida corta (aparece en la tarjeta), widget: string, required: false, hint: "Ej. 45 × 45 cm, 350 ml, Set de 3" }
      - name: opciones
        label: Opciones (color, tamaño, aroma…)
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: titulo, label: "Título (ej. Color, Tamaño)", widget: string, required: false }
          - name: items
            label: Opciones
            widget: list
            required: false
            summary: "{{nombre}}"
            fields:
              - { name: nombre, label: Nombre, widget: string }
              - { name: color, label: Color (solo si es un color), widget: color, required: false }
              - { name: nota, label: "Nota (ej. 40 × 25 cm)", widget: string, required: false }
              - { name: precio, label: "Precio normal propio (Gs.)", widget: number, value_type: int, required: false, hint: "Vacío = usa el precio del producto." }
              - { name: precioOferta, label: "Precio de oferta propio (Gs.)", widget: number, value_type: int, required: false }
              - { name: fotos, label: Fotos de esta opción, widget: list, required: false, field: { name: foto, label: Foto, widget: image } }
      - name: detalles
        label: Detalles (ficha)
        widget: list
        required: false
        summary: "{{clave}}: {{valor}}"
        fields:
          - { name: clave, label: "Dato (ej. Material)", widget: string }
          - { name: valor, label: "Valor (ej. 100% lino)", widget: string }
      - name: combinaCon
        label: Combina con (Completá el ambiente)
        hint: "2 o 3 productos que se sugieren en la ficha y en el carrito. Si lo dejás vacío, se sugieren productos del mismo ambiente."
        widget: relation
        collection: productos
        multiple: true
        required: false
        value_field: slug
        search_fields: [nombre]
        display_fields: [nombre]
      - { name: orden, label: Orden, widget: number, value_type: int, default: 100, hint: "Más chico = aparece antes (después de los destacados)." }
      - name: ilustracion
        label: Ilustración de reemplazo (si no hay foto)
        widget: select
        required: false
        options: [taza, vasos, toallas, vela, tabla, florero, manta, cubiertos, frascos]
      - { name: fondo, label: Color de fondo de la ilustración, widget: color, required: false }

  - name: combos
    label: Combos
    label_singular: Combo
    description: "Packs de varios productos con precio especial. El precio «por separado» se calcula solo. Si un producto del combo está agotado, el combo también."
    folder: src/content/combos
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{fields.slug}}"
    identifier_field: nombre
    summary: "{{activo | ternary('', '[OCULTO] ')}}{{nombre}} — Gs. {{precio}}"
    fields:
      - { name: activo, label: Activo (se muestra en la web), widget: boolean, default: true }
      - { name: nombre, label: Nombre, widget: string, hint: "Ej. Combo Rincón de sillón" }
      - name: slug
        label: Identificador (va en el enlace)
        widget: string
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Solo minúsculas, números y guiones']
      - name: incluye
        label: Productos incluidos
        widget: list
        summary: "{{cantidad}} × {{producto}} {{opcion}}"
        fields:
          - { name: producto, label: Producto, widget: relation, collection: productos, value_field: slug, search_fields: [nombre], display_fields: [nombre] }
          - { name: opcion, label: "Opción (ej. Terracota, Grande)", widget: string, required: false, hint: "Escribila igual que en el producto. Vacío = la opción principal." }
          - { name: cantidad, label: Cantidad, widget: number, value_type: int, min: 1, default: 1 }
      - { name: precio, label: "Precio del combo (Gs.)", widget: number, value_type: int, min: 0, hint: "Tiene que ser menor que la suma por separado para que se vea el ahorro. Con precio 0 el combo no se muestra." }
      - { name: bono, label: Bono (opcional), widget: string, required: false, hint: "Ej. Envoltorio de regalo incluido" }
      - { name: etiqueta, label: Etiqueta, widget: string, required: false, default: Combo }
      - { name: fotos, label: Fotos, widget: list, required: false, field: { name: foto, label: Foto, widget: image }, hint: "Si no cargás foto, se usa la del primer producto." }
      - { name: resumen, label: Resumen (una línea), widget: string, required: false }
      - { name: descripcion, label: Descripción, widget: text, required: false }
      - { name: destacado, label: Destacado, widget: boolean, default: false }
      - { name: orden, label: Orden, widget: number, value_type: int, default: 5 }

  - name: opiniones
    label: Opiniones
    label_singular: Opinión
    description: "Opiniones reales de clientes. Se muestran debajo de la portada, en la ficha del producto y en el carrito. Si no hay ninguna activa, no se muestra nada."
    folder: src/content/opiniones
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{nombre}}-{{year}}{{month}}{{day}}"
    identifier_field: nombre
    summary: "{{activo | ternary('', '[OCULTA] ')}}{{nombre}}, {{barrio}} — {{texto}}"
    fields:
      - { name: activo, label: Activa (se muestra en la web), widget: boolean, default: true }
      - { name: texto, label: Lo que dijo, widget: text, hint: "Mejor corto: una o dos frases." }
      - { name: nombre, label: Nombre, widget: string, hint: "Ej. Ana" }
      - { name: barrio, label: Barrio o ciudad, widget: string, required: false, hint: "Ej. Villa Morra" }
      - { name: producto, label: Producto que compró (opcional), widget: relation, collection: productos, value_field: slug, search_fields: [nombre], display_fields: [nombre], required: false }
      - { name: foto, label: Foto (opcional), widget: image, required: false }
      - { name: orden, label: Orden, widget: number, value_type: int, default: 100 }

  - name: tienda
    label: Tienda
    description: Nombre, WhatsApp, textos de la portada y listas de tipos y ambientes.
    files:
      - name: config
        label: Configuración de la tienda
        file: src/data/tienda.json
        format: json
        fields:
          - { name: nombre, label: Nombre de la tienda, widget: string }
          - { name: lema, label: Lema (debajo del nombre), widget: string }
          - { name: whatsapp, label: "WhatsApp (con 595, sin + ni espacios)", widget: string, pattern: ['^[0-9]{8,15}$', 'Solo números, ej. 595981123456'] }
          - { name: anuncios, label: Barra de anuncios, widget: list, field: { name: texto, label: Texto, widget: string } }
          - { name: portada, label: Foto de portada, widget: image, required: false }
          - { name: portadaAlt, label: Descripción de la foto (accesibilidad), widget: string, required: false }
          - { name: eyebrow, label: Texto chico arriba del título, widget: string }
          - { name: titulo, label: Título de portada, widget: string }
          - { name: bajada, label: Texto de portada, widget: text }
          - { name: ctaCatalogo, label: "Botón 1 de portada (ej. Ver el catálogo)", widget: string }
          - { name: ctaWhatsapp, label: "Botón 2 de portada (ej. Escribinos)", widget: string }
          - { name: plazoEntrega, label: Plazo de entrega, widget: string, required: false, hint: "Ej. «en 24 a 48 h hábiles». Se muestra como «Entrega en 24 a 48 h hábiles» en la portada, la ficha y el carrito. Vacío = no se muestra." }
          - { name: garantia, label: Garantía y cambios (texto corto), widget: string, required: false, hint: "Ej. «Cambios dentro de 7 días (ropa de cama, solo sin abrir)». Se muestra en la portada, la ficha y el carrito. Vacío = no se muestra." }
          - name: envio
            label: Envío gratis
            widget: object
            collapsed: false
            fields:
              - { name: activo, label: Activar envío gratis, widget: boolean, default: false, hint: "Prendido: barra de progreso en el carrito y aviso en la barra de anuncios." }
              - { name: gratisDesde, label: "Envío gratis desde (Gs.)", widget: number, value_type: int, min: 0, hint: "Se aplica a todas las zonas, salvo las marcadas «sin envío gratis»." }
          - name: zonas
            label: Zonas de envío (el cliente elige una en el carrito)
            widget: list
            summary: "{{nombre}} — Gs. {{costo}}"
            fields:
              - { name: nombre, label: "Zona (ej. Asunción)", widget: string }
              - { name: costo, label: "Costo de envío (Gs.)", widget: number, value_type: int, min: 0, required: false, hint: "0 o vacío = «costo a coordinar» por WhatsApp." }
              - { name: sinEnvioGratis, label: Sin envío gratis en esta zona, widget: boolean, default: false, required: false, hint: "Ej. Interior: aunque supere el monto, el envío se coordina aparte." }
          - name: retiro
            label: Retiro (sin dirección visible)
            widget: object
            fields:
              - { name: activo, label: Ofrecer retiro, widget: boolean, default: true }
              - { name: texto, label: Texto de la opción, widget: string, default: Retiro coordinado }
              - { name: detalle, label: Aclaración, widget: string, required: false, hint: "Ej. Sin costo. Te pasamos el punto de retiro por WhatsApp." }
          - { name: pagos, label: Formas de pago (el cliente elige una), widget: list, required: false, field: { name: pago, label: Forma de pago, widget: string } }
          - name: factura
            label: Factura
            widget: object
            fields:
              - { name: activo, label: "Ofrecer «Necesito factura» (pide RUC y razón social)", widget: boolean, default: true }
          - name: camposExtra
            label: Preguntas extra en el carrito
            hint: "Se agregan al paso «Tus datos» y salen en el mensaje de WhatsApp. Ej. «Fecha preferida de entrega», «¿Cómo nos conociste?»."
            widget: list
            required: false
            summary: "{{etiqueta}}"
            fields:
              - { name: etiqueta, label: Pregunta, widget: string }
              - { name: tipo, label: Tipo de respuesta, widget: select, default: texto, options: [{ label: Texto libre, value: texto }, { label: Lista de opciones, value: opciones }] }
              - { name: opciones, label: "Opciones (solo si es lista)", widget: list, required: false, field: { name: opcion, label: Opción, widget: string } }
              - { name: ayuda, label: Texto de ayuda (opcional), widget: string, required: false }
              - { name: obligatorio, label: Obligatoria, widget: boolean, default: false }
          - name: regalo
            label: Envoltorio para regalo
            widget: object
            collapsed: false
            fields:
              - { name: activo, label: Ofrecer envoltorio para regalo, widget: boolean, default: false, hint: "Prendido: aparece una casilla en el carrito." }
              - { name: precio, label: "Precio del envoltorio (Gs.)", widget: number, value_type: int, min: 0 }
          - { name: opinionesTitulo, label: Título de la franja de opiniones, widget: string, required: false }
          - name: destacado
            label: Producto destacado en portada
            widget: relation
            collection: productos
            value_field: slug
            search_fields: [nombre]
            display_fields: [nombre]
          - { name: catalogoEyebrow, label: Catálogo · texto chico, widget: string }
          - { name: catalogoTitulo, label: Catálogo · título, widget: string }
          - { name: catalogoBajada, label: Catálogo · texto, widget: string }
          - { name: sobre, label: Sobre nosotros (pie de página), widget: text }
          - name: compromisos
            label: Compromisos
            widget: list
            summary: "{{texto}}"
            fields:
              - { name: icono, label: Ícono, widget: select, options: [{ label: Envío, value: truck }, { label: Pago, value: card }, { label: Chat, value: chat }, { label: Reloj, value: clock }, { label: Garantía, value: shield }, { label: Regalo, value: gift }] }
              - { name: texto, label: "Texto (lo que va antes de ':' se destaca)", widget: string }
          - { name: pie, label: Aclaración del pie, widget: string }
          - { name: tipos, label: Tipos de producto (pestañas), widget: list, field: { name: tipo, label: Tipo, widget: string } }
          - { name: ambientes, label: Ambientes, widget: list, field: { name: ambiente, label: Ambiente, widget: string } }
